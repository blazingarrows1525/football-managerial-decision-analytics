[theme]
base = "light"
primaryColor = "#2a9d8f"
backgroundColor = "#fbfaf7"
secondaryBackgroundColor = "#f1efe8"
textColor = "#1f2933"
font = "sans serif"

[server]
headless = true
runOnSave = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = true
